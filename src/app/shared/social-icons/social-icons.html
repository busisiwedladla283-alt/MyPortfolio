<div class="social-container" [class.vertical]="layout === 'vertical'" [class.hero-layout]="layout === 'hero'">
  @for (item of socials; track item.name) {
    <a [href]="item.url" 
       target="_blank" 
       rel="noopener noreferrer"
       class="social-link" 
       [attr.aria-label]="item.ariaLabel"
       [title]="item.name">
      
      @if (item.icon) {
        <i [class]="item.icon + ' social-icon'"></i>
      } @else {
        <svg class="social-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect width="20" height="16" x="2" y="4" rx="2"></rect>
          <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
        </svg>
      }

      @if (showLabels) {
        <span class="social-label">{{ item.name }}</span>
      }
    </a>
  }
</div>
