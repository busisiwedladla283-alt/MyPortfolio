<header class="navbar-wrapper" [class.scrolled]="isScrolled()">
  <nav class="navbar-container">
    <!-- Brand Logo -->
    <a href="#home" class="brand-logo" (click)="scrollToSection('#home')">
      <span class="logo-text">BD</span>
      <span class="logo-dot"></span>
    </a>

    <!-- Desktop Nav Links -->
    <ul class="nav-menu">
      @for (link of navLinks; track link.id) {
        <li class="nav-item">
          <a [href]="link.href" 
             class="nav-link" 
             [class.active]="activeSection() === link.id"
             (click)="$event.preventDefault(); scrollToSection(link.href)">
            {{ link.name }}
          </a>
        </li>
      }
    </ul>

    <!-- Actions Area -->
    <div class="nav-actions">
      <!-- Theme Switcher Button -->
      <button class="theme-toggle-btn" 
              (click)="toggleTheme()" 
              [attr.aria-label]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'"
              [title]="themeService.isDark() ? 'Switch to light mode' : 'Switch to dark mode'">
        @if (themeService.isDark()) {
          <!-- Sun Icon -->
          <svg class="theme-icon sun-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2"></path>
            <path d="M12 20v2"></path>
            <path d="m4.93 4.93 1.41 1.41"></path>
            <path d="m17.66 17.66 1.41 1.41"></path>
            <path d="M2 12h2"></path>
            <path d="M20 12h2"></path>
            <path d="m6.34 17.66-1.41 1.41"></path>
            <path d="m19.07 4.93-1.41 1.41"></path>
          </svg>
        } @else {
          <!-- Moon Icon -->
          <svg class="theme-icon moon-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"></path>
          </svg>
        }
      </button>

      <!-- CTA Button -->
      <a href="#contact" 
         class="nav-cta-btn" 
         (click)="$event.preventDefault(); scrollToSection('#contact')">
        <span>Let's Talk</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-4 h-4">
          <path d="M5 12h14"></path>
          <path d="m12 5 7 7-7 7"></path>
        </svg>
      </a>

      <!-- Mobile Hamburger Button -->
      <button class="hamburger-btn" 
              (click)="toggleMobileMenu()" 
              [class.open]="isMobileMenuOpen()"
              aria-label="Toggle Navigation Menu">
        <span></span>
        <span></span>
        <span></span>
      </button>
    </div>
  </nav>

  <!-- Mobile Navigation Drawer -->
  @if (isMobileMenuOpen()) {
    <div class="mobile-drawer-backdrop" (click)="closeMobileMenu()"></div>
    <div class="mobile-drawer">
      <ul class="mobile-nav-list">
        @for (link of navLinks; track link.id) {
          <li>
            <a [href]="link.href" 
               class="mobile-nav-link"
               [class.active]="activeSection() === link.id"
               (click)="$event.preventDefault(); scrollToSection(link.href)">
              {{ link.name }}
            </a>
          </li>
        }
      </ul>
      <div class="mobile-drawer-footer">
        <a href="#contact" 
           class="btn-primary w-full text-center" 
           (click)="$event.preventDefault(); scrollToSection('#contact')">
          Get in Touch
        </a>
      </div>
    </div>
  }
</header>
